apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: respaldos-mongo-data
  namespace: fulfill
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-respaldo-mongo
  namespace: fulfill
spec:
  podSelector:
    matchLabels:
      app: fulfill-mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backup-mongo
      ports:
        - protocol: TCP
          port: 27017

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: salida-backup-mongo
  namespace: fulfill
spec:
  podSelector:
    matchLabels:
      app: backup-mongo
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: fulfill-mongo
      ports:
        - protocol: TCP
          port: 27017
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-mongo
  namespace: fulfill
spec:
  schedule: "30 2 * * *"
  timeZone: America/Mexico_City
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600

      template:
        metadata:
          labels:
            app: backup-mongo

        spec:
          restartPolicy: Never
          automountServiceAccountToken: false

          containers:
            - name: backup-mongo
              image: mongo:8
              imagePullPolicy: IfNotPresent

              command:
                - /bin/sh
                - -ec
                - |
                  umask 077

                  FECHA=$(date -u +%Y%m%dT%H%M%SZ)
                  DESTINO="/respaldos/mongo-${FECHA}.archive.gz"
                  TEMPORAL="${DESTINO}.tmp"

                  trap 'rm -f "$TEMPORAL"' EXIT

                  PASS=$(printf '%s' "$MONGO_BACKUP_PASSWORD" | tr -d '\r\n')

                  echo "Iniciando respaldo MongoDB"

                  mongodump \
                    --host mongo \
                    --port 27017 \
                    --username fulfill_backup \
                    --password "$PASS" \
                    --authenticationDatabase admin \
                    --db fulfill_logs \
                    --archive="$TEMPORAL" \
                    --gzip

                  unset PASS

                  test -s "$TEMPORAL"
                  gzip -t "$TEMPORAL"

                  mv "$TEMPORAL" "$DESTINO"
                  trap - EXIT

                  cd /respaldos

                  sha256sum "$(basename "$DESTINO")" \
                    > "$(basename "$DESTINO").sha256"

                  find /respaldos -type f \
                    -name 'mongo-*.archive.gz' \
                    -mtime +6 -delete

                  find /respaldos -type f \
                    -name 'mongo-*.archive.gz.sha256' \
                    -mtime +6 -delete

                  echo "Respaldo MongoDB finalizado correctamente"
                  ls -lh "$DESTINO"

              env:
                - name: MONGO_BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: fulfill-mongo-credentials
                      key: MONGO_BACKUP_PASSWORD

              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 512Mi

              volumeMounts:
                - name: respaldos
                  mountPath: /respaldos

          volumes:
            - name: respaldos
              persistentVolumeClaim:
                claimName: respaldos-mongo-data
