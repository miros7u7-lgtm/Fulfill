apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flask-egress-restringido
  namespace: fulfill

spec:
  podSelector:
    matchLabels:
      app: fulfill-web

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: fulfill-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: fulfill-mongo
      ports:
        - protocol: TCP
          port: 27017
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
