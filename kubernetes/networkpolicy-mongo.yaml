apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-only-flask
  namespace: fulfill

spec:
  podSelector:
    matchLabels:
      app: fulfill-mongo

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fulfill-web
      ports:
        - protocol: TCP
          port: 27017
