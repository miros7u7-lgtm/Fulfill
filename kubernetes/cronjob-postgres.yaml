apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: respaldos-postgres-data
  namespace: fulfill
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-respaldo-postgres
  namespace: fulfill
spec:
  podSelector:
    matchLabels:
      app: fulfill-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backup-postgres
      ports:
        - protocol: TCP
          port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: salida-backup-postgres
  namespace: fulfill
spec:
  podSelector:
    matchLabels:
      app: backup-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: fulfill-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres
  namespace: fulfill
spec:
  schedule: "0 2 * * *"
  timeZone: America/Mexico_City
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: backup-postgres
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false

          containers:
            - name: backup-postgres
              image: postgres:18
              imagePullPolicy: IfNotPresent

              command:
                - /bin/sh
                - -ec
                - |
                  umask 077
                  FECHA=$(date -u +%Y%m%dT%H%M%SZ)
                  DESTINO="/respaldos/postgres-${FECHA}.dump"
                  TEMPORAL="${DESTINO}.tmp"

                  trap 'rm -f "$TEMPORAL"' EXIT

                  echo "Iniciando respaldo PostgreSQL"

                  pg_dump \
                    -h postgres \
                    -p 5432 \
                    -U "$PGUSER" \
                    -d "$PGDATABASE" \
                    -Fc \
                    -f "$TEMPORAL"

                  test -s "$TEMPORAL"
                  pg_restore -l "$TEMPORAL" > /dev/null

                  mv "$TEMPORAL" "$DESTINO"
                  trap - EXIT

                  cd /respaldos
                  sha256sum "$(basename "$DESTINO")" \
                    > "$(basename "$DESTINO").sha256"

                  find /respaldos -type f \
                    -name 'postgres-*.dump' \
                    -mtime +6 -delete

                  find /respaldos -type f \
                    -name 'postgres-*.dump.sha256' \
                    -mtime +6 -delete

                  echo "Respaldo finalizado correctamente"
                  ls -lh "$DESTINO"

              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: fulfill-secret
                      key: DB_USER

                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: fulfill-secret
                      key: DB_PASSWORD

                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: fulfill-config
                      key: DB_NAME

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi

              volumeMounts:
                - name: respaldos
                  mountPath: /respaldos

          volumes:
            - name: respaldos
              persistentVolumeClaim:
                claimName: respaldos-postgres-data
