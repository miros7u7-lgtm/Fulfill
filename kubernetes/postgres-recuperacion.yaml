apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-recuperacion-data
  namespace: fulfill-recuperacion
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-recuperacion
  namespace: fulfill-recuperacion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-recuperacion
  template:
    metadata:
      labels:
        app: postgres-recuperacion
    spec:
      automountServiceAccountToken: false

      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent

          env:
            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_DB
              value: fulfill_restore

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-recuperacion-secret
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/18/docker

          ports:
            - containerPort: 5432

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-recuperacion-data
