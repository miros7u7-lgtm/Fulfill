apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flask-only-traefik
  namespace: fulfill

spec:
  podSelector:
    matchLabels:
      app: fulfill-web

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik

      ports:
        - protocol: TCP
          port: 5000
