apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: fulfill
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: fulfill
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fulfill-mongo
  template:
    metadata:
      labels:
        app: fulfill-mongo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:8
          imagePullPolicy: IfNotPresent
          command:
            - mongod
            - --bind_ip_all
            - --auth
            - --wiredTigerCacheSizeGB
            - "0.25"

          envFrom:
            - secretRef:
                name: fulfill-mongo-credentials

          ports:
            - containerPort: 27017

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 10

          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db

      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-data

---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: fulfill
spec:
  type: ClusterIP
  selector:
    app: fulfill-mongo
  ports:
    - port: 27017
      targetPort: 27017
