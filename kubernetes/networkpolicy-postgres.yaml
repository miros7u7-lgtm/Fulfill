apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-only-flask
  namespace: fulfill
spec:
  podSelector:
    matchLabels:
      app: fulfill-postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fulfill-web
      ports:
        - protocol: TCP
          port: 5432
