apiVersion: batch/v1
kind: Job
metadata:
  name: verificar-backup-postgres
  namespace: fulfill
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: verificar
          image: postgres:18
          command:
            - /bin/sh
            - -ec
            - |
              cd /respaldos
              for archivo in postgres-*.dump; do
                test -f "$archivo"
                sha256sum -c "$archivo.sha256"
                pg_restore -l "$archivo" > /dev/null
                echo "Archivo PostgreSQL valido: $archivo"
              done
          volumeMounts:
            - name: respaldos
              mountPath: /respaldos
              readOnly: true
      volumes:
        - name: respaldos
          persistentVolumeClaim:
            claimName: respaldos-postgres-data

---
apiVersion: batch/v1
kind: Job
metadata:
  name: verificar-backup-mongo
  namespace: fulfill
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: verificar
          image: mongo:8
          command:
            - /bin/sh
            - -ec
            - |
              cd /respaldos
              for archivo in mongo-*.archive.gz; do
                test -f "$archivo"
                sha256sum -c "$archivo.sha256"
                gzip -t "$archivo"
                echo "Archivo MongoDB valido: $archivo"
              done
          volumeMounts:
            - name: respaldos
              mountPath: /respaldos
              readOnly: true
      volumes:
        - name: respaldos
          persistentVolumeClaim:
            claimName: respaldos-mongo-data
