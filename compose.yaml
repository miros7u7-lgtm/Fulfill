name: fulfill

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5001:5000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      MONGO_URI: mongodb://mongo:27017/
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:?Configurar DB_NAME}
      POSTGRES_USER: ${DB_USER:?Configurar DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configurar DB_PASSWORD}
    volumes:
      - fulfill_postgres_data:/var/lib/postgresql
      - ./database/fulfill_docker.sql:/docker-entrypoint-initdb.d/01-fulfill.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  mongo:
    image: mongo:8
    volumes:
      - fulfill_mongo_data:/data/db
    restart: unless-stopped

volumes:
  fulfill_postgres_data:
  fulfill_mongo_data:
